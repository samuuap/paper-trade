[project]
name = "paper-trade-backend"
version = "0.1.0"
description = "Paper trading arena: competing LLM agents on US equities, fully instrumented."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.27",
    "websockets>=13.1",
    "apscheduler>=3.10,<4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-market-calendars>=4.4",
    "structlog>=24.4",
    "orjson>=3.10",
    "psutil>=6.1",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented idiom.
    "E501",    # Line length is handled by the formatter, not by failing a lint.
    # The codebase uses `Optional[X]` and `typing.Sequence` consistently.
    # Switching to `X | None` and `collections.abc` is a whole-repo restyle
    # with no behavioural gain, so it is a deliberate choice rather than debt.
    "UP035",   # deprecated-import (typing.Sequence and friends)
    "UP037",   # quoted-annotation
    "UP045",   # non-pep604-annotation-optional
    "UP017",   # datetime.timezone.utc -> datetime.UTC
    # `class Phase(str, Enum)` is load-bearing: the enums are persisted as
    # VARCHAR and compared against strings. Converting them to StrEnum changes
    # serialisation behaviour, which makes this a schema question, not a style
    # one. See PLAN.md 11.
    "UP042",   # replace-str-enum
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures need a session-scoped loop; the database and
# the synthetic market data are built once for the whole run.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
